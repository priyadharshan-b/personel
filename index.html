<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Priyadharshan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="content">

      <!-- Intro Block -->
      <section class="intro">
        <p class="greeting">Hey, I’m</p>
        <h1 class="name">PRIYADHARSHAN</h1>
        <p class="bio">
          Explore my projects, experiments, ideas, and everything I’m building along the way.
        </p>
      </section>

      <!-- Action Block -->
      <section class="action">
        <p class="start-label">Let’s Get Started...</p>

        <div class="button-group">
          <!-- Continue with Google -->
          <button class="btn" id="googleBtn" type="button" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" width="22" height="22" class="google-icon" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span class="btn-text">Continue with Google</span>
          </button>

          <!-- Continue with Email -->
          <button class="btn" id="emailBtn" type="button" aria-label="Continue with Email">
            <div class="email-badge" aria-hidden="true">
              <span class="email-symbol">@</span>
            </div>
            <span class="btn-text">Continue with Email</span>
          </button>
        </div>

        <!-- Switch text -->
        <p class="switch-text">
          Already have an account? <a href="#" class="login-link">Login</a>
        </p>
      </section>

    </div>
  </main>
</body>
</html>
