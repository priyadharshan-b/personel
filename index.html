<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#180B22">
    <meta name="color-scheme" content="dark">

    <meta
        name="description"
        content="Priyadharshan — Personal Portfolio"
    >

    <title>Priyadharshan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="welcome-card">

            <div class="content">

                <!-- Introduction -->
                <div class="intro">

                    <p class="greeting">
                        Hey, I’m
                    </p>

                    <h1>
                        PRIYADHARSHAN
                    </h1>

                    <p class="description">
                        Explore my projects, experiments, ideas, and
                        everything I’m building along the way.
                    </p>

                </div>


                <!-- Authentication -->
                <div class="auth">

                    <p class="start-text">
                        Let’s Get Started...
                    </p>


                    <!-- Google -->
                    <button
                        class="auth-button"
                        id="googleButton"
                        type="button"
                    >

                        <svg
                            class="button-icon google-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.19z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.51A9.75 9.75 0 0 0 12 21.75z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.53 13.85a5.86 5.86 0 0 1 0-3.7V7.64H3.29a9.75 9.75 0 0 0 0 8.72l3.24-2.51z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.13c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.2 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.39l3.24 2.51C7.3 7.84 9.46 6.13 12 6.13z"
                            />
                        </svg>

                        <span>
                            Continue with Google
                        </span>

                    </button>


                    <!-- Email -->
                    <button
                        class="auth-button"
                        id="emailButton"
                        type="button"
                    >

                        <svg
                            class="button-icon email-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 17V7A1.5 1.5 0 0 1 4 5.5Z"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <path
                                d="m3.5 7 8.5 6 8.5-6"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>

                        <span>
                            Continue with Email
                        </span>

                    </button>


                    <p class="login-text">

                        Already have an account?

                        <a href="#" id="loginLink">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js" defer></script>

</body>
</html>
